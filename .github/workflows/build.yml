name: Magisk Build

on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "native/**"
      - "scripts/**"
      - "tools/**"
      - "build.py"
      - ".gitmodules"
      - ".github/actions/setup/**"
      - ".github/docker/**"
      - ".github/ci.prop"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magisk-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Magisk artifacts (Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: eclipse-temurin:25-jdk-noble
    defaults:
      run:
        shell: bash
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_USER_HOME: /root/.android
      GRADLE_USER_HOME: /root/.gradle
      CARGO_HOME: /root/.cargo
      GRADLE_OPTS: -Dorg.gradle.workers.max=2
    steps:
      - name: Install container dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl file git python3 unzip xz-utils zip

      - name: Check out
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
          persist-credentials: false

      - name: Cache Android SDK and ONDK
        uses: actions/cache@v5
        with:
          path: /opt/android-sdk
          key: docker-android-${{ runner.arch }}-${{ hashFiles('scripts/env.py', '.github/docker/setup.sh') }}

      - name: Cache Gradle and Cargo downloads
        uses: actions/cache@v5
        with:
          path: |
            /root/.gradle/caches
            /root/.gradle/wrapper
            /root/.cargo/registry
            /root/.cargo/git
          key: docker-deps-${{ runner.arch }}-${{ hashFiles('app/gradle/**', '**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            docker-deps-${{ runner.arch }}-${{ hashFiles('app/gradle/**', '**/Cargo.lock') }}-

      - name: Set up Android toolchains
        id: toolchains
        run: bash .github/docker/setup.sh

      - name: Build release
        run: |
          ./build.py -vr native 2>&1 | tee build-native.log
          ./build.py -vr app 2>&1 | tee build-release.log
          cp -- out/app-release.apk out/Magisk.apk

      - name: Stop gradle daemon
        if: always() && steps.toolchains.outcome == 'success'
        run: ./scripts/env.py ./app/gradlew --stop

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Magisk-APK
          path: out/Magisk.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload failed build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.sha }}-docker-logs
          path: build-*.log
          if-no-files-found: ignore
